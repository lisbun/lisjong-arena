[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lisjong-arena"
version = "0.1.0"
description = "Reproducible policy comparison arena for the lisjong ecosystem"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
authors = [{ name = "lisbun" }]
dependencies = [
    "lisjong @ git+https://github.com/lisbun/lisjong.git@1bc334b6d5df8089a408e80b89f691af0e9d1c80",
    "lisjong-engine @ git+https://github.com/lisbun/lisjong-engine.git@2c5ba3969dc70705303ad8bdd79caefdd674ed5e",
    "riichienv==0.4.8",
    "websockets==17.0.1",
]

[project.optional-dependencies]
dev = ["ruff==0.16.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
