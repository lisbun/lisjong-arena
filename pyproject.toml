[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lisjong-arena"
version = "0.1.0"
description = "Reproducible policy comparison arena for the lisjong ecosystem"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
authors = [{ name = "lisbun" }]
dependencies = [
    "lisjong @ git+https://github.com/lisbun/lisjong.git@2a9debebdbbe4d10841fa4371a6cf6bf19ce9de1",
    "lisjong-engine @ git+https://github.com/lisbun/lisjong-engine.git@8735e89e1aea000ab59368d0368d476787827741",
    "riichienv==0.4.10",
    "websockets==17.0.1",
]

[project.optional-dependencies]
dev = ["ruff==0.16.0"]
ml = ["torch==2.13.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lisjong_arena = ["seed-ledger.json"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
