[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lisjong-arena"
version = "0.1.0"
description = "Reproducible policy comparison arena for the lisjong ecosystem"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
authors = [{ name = "lisbun" }]
dependencies = [
    "lisjong @ git+https://github.com/lisbun/lisjong.git@3505321b62e7a2be204cc555924b485a898c8f31",
    "riichienv==0.4.8",
    "websockets==17.0.1",
]

[project.optional-dependencies]
dev = ["ruff==0.16.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
