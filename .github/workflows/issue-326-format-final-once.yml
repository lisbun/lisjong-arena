name: issue-326-format-final-once

on:
  push:
    branches: [issue-326-wait-shape-pilot]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-326-wait-shape-pilot
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install --disable-pip-version-check ruff==0.16.0
      - name: Format changed Python
        run: |
          python -m ruff check --fix src/lisjong_arena/wait_shape_qualification/pilot.py tests/test_wait_shape_pilot.py
          python -m ruff format src/lisjong_arena/wait_shape_qualification/pilot.py tests/test_wait_shape_pilot.py
          git diff --check
      - name: Commit if needed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lisjong_arena/wait_shape_qualification/pilot.py tests/test_wait_shape_pilot.py
          git commit -m "#326: apply final Ruff formatting"
          git push origin HEAD:issue-326-wait-shape-pilot
