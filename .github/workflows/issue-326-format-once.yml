name: issue-326-format-once

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'issue-326-wait-shape-pilot'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-326-wait-shape-pilot
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install Ruff
        run: python -m pip install --disable-pip-version-check ruff==0.16.0
      - name: Apply lint fixes and formatting
        run: |
          python -m ruff check --fix src/lisjong_arena/wait_shape_qualification/pilot.py tests/test_wait_shape_pilot.py
          python -m ruff format src/lisjong_arena/wait_shape_qualification/pilot.py tests/test_wait_shape_pilot.py
          git diff --check
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lisjong_arena/wait_shape_qualification/pilot.py tests/test_wait_shape_pilot.py
          git commit -m "#326: apply Ruff formatting"
          git push origin HEAD:issue-326-wait-shape-pilot
