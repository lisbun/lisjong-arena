name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install package and development tools
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Run lint
        run: python -m ruff check .

      - name: Run tests
        run: python -m unittest discover -s tests -v --durations 30

  ml-tests:
    name: ml-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install package and development tools
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Install locked CPU PyTorch
        run: python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu "torch==2.13.0"

      - name: Verify locked CPU PyTorch
        run: python -c "import torch; assert torch.__version__ == '2.13.0+cpu'; assert not torch.cuda.is_available()"

      - name: Run all test modules with ML dependency in isolated interpreters
        shell: bash
        run: |
          mapfile -d '' -t test_files < <(
            find tests -type f -name 'test*.py' -print0 | sort -z
          )
          ((${#test_files[@]} > 0))

          test_runner="$RUNNER_TEMP/run_unittest_module.py"
          cat > "$test_runner" <<'PY'
          import sys
          import unittest


          def main() -> int:
              pattern, test_file, allow_zero_text = sys.argv[1:]
              suite = unittest.defaultTestLoader.discover("tests", pattern=pattern)
              test_count = suite.countTestCases()

              if test_count == 0:
                  if allow_zero_text == "true":
                      print(f"Intentional zero-test compatibility stub: {test_file}")
                      return 0
                  print(f"No unittest cases discovered: {test_file}", file=sys.stderr)
                  return 1

              runner = unittest.TextTestRunner(verbosity=2, durations=30)
              result = runner.run(suite)
              return 0 if result.wasSuccessful() else 1


          if __name__ == "__main__":
              raise SystemExit(main())
          PY

          declare -A seen_patterns=()
          for test_file in "${test_files[@]}"; do
            pattern="$(basename "$test_file")"
            if [[ -n "${seen_patterns[$pattern]:-}" ]]; then
              echo "Duplicate test filename cannot be isolated safely: $pattern" >&2
              echo "  ${seen_patterns[$pattern]}" >&2
              echo "  $test_file" >&2
              exit 1
            fi
            seen_patterns[$pattern]="$test_file"

            allow_zero=false
            if [[ "$test_file" == "tests/test_comparison_parallel_integration.py" ]]; then
              allow_zero=true
            fi

            python "$test_runner" "$pattern" "$test_file" "$allow_zero"
          done
