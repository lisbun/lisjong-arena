name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install package and development tools
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Run lint
        run: python -m ruff check .

      - name: Run tests
        run: python -m unittest discover -s tests -v --durations 30

  ml-tests:
    name: ml-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install package and development tools
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Install locked CPU PyTorch
        run: python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu "torch==2.13.0"

      - name: Verify locked CPU PyTorch
        run: python -c "import torch; assert torch.__version__ == '2.13.0+cpu'; assert not torch.cuda.is_available()"

      - name: Run test modules with ML dependency in isolated interpreters
        shell: bash
        run: |
          shopt -s nullglob
          test_files=(tests/test*.py)
          ((${#test_files[@]} > 0))
          for test_file in "${test_files[@]}"; do
            if python -m unittest discover \
              -s tests \
              -p "$(basename "$test_file")" \
              -v \
              --durations 30; then
              continue
            fi

            status=$?
            if [[ $status -eq 5 && "$test_file" != *_ml.py ]]; then
              echo "No unittest cases discovered in non-ML module: $test_file"
              continue
            fi
            exit "$status"
          done
