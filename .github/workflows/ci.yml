name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # #531: lisjong requires its native extension (lisjong#346), so every test job
  # installs a wheel built from this pinned lisjong revision. It must equal the
  # pyproject pin (checked in native-wheel). Execution environments use the
  # hash-verified lisjong main CI wheel instead (docs/lisjong-native-wheel-current.md).
  LISJONG_NATIVE_SOURCE_REVISION: "7fc1130f9a6498d0de809f8128608b753c829415"

jobs:
  static-checks:
    name: static-checks
    # environment_verify / seed_registry import lisjong_arena, which needs the
    # native extension since #531.
    needs: native-wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install package and development tools
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Download the same-revision native wheel
        uses: actions/download-artifact@v4
        with:
          name: lisjong-native-ci-wheel
          path: wheelhouse

      - name: Install the same-revision native wheel (binary only, no index)
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check \
            --only-binary=:all: --no-index --no-deps wheelhouse/*.whl
          test "$(python -c 'import _lisjong_native; print(_lisjong_native.SOURCE_REVISION)')" = "$LISJONG_NATIVE_SOURCE_REVISION"

      - name: Verify internal VCS dependency identity
        run: python -m lisjong_arena.environment_verify --project pyproject.toml

      - name: Validate Arena seed ledger bootstrap
        shell: bash
        run: |
          python -m lisjong_arena.seed_registry validate-bootstrap
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch --no-tags origin "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
            base_ledger="${RUNNER_TEMP}/base-seed-ledger.json"
            if git show "origin/${{ github.base_ref }}:src/lisjong_arena/seed-ledger.json" > "$base_ledger" 2>/dev/null; then
              python -m lisjong_arena.seed_registry validate-branch --base-ledger "$base_ledger"
            else
              python -m lisjong_arena.seed_registry validate-branch
            fi
          fi

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Run lint
        run: python -m ruff check .

  # Builds _lisjong_native once from the pinned lisjong revision (#531). The
  # build embeds LISJONG_NATIVE_SOURCE_REVISION as SOURCE_REVISION.
  native-wheel:
    name: native-wheel
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Require the native revision to be the project pin
        run: grep -F "lisjong.git@${LISJONG_NATIVE_SOURCE_REVISION}\"" pyproject.toml

      - name: Build the same-revision native wheel
        run: |
          python -m pip wheel --disable-pip-version-check --no-deps --wheel-dir wheelhouse \
            "git+https://github.com/lisbun/lisjong.git@${LISJONG_NATIVE_SOURCE_REVISION}#subdirectory=native"
          ls -l wheelhouse

      - name: Upload native wheel
        uses: actions/upload-artifact@v4
        with:
          name: lisjong-native-ci-wheel
          path: wheelhouse/
          if-no-files-found: error
          retention-days: 7

  # The full suite without the ML dependency, split so that a slow runner stays
  # inside the job limit (#467). Every test module is in exactly one shard.
  test-shards:
    name: tests-shard-${{ matrix.shard }}
    needs: native-wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install package and development tools
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Download the same-revision native wheel
        uses: actions/download-artifact@v4
        with:
          name: lisjong-native-ci-wheel
          path: wheelhouse

      - name: Install the same-revision native wheel (binary only, no index)
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check \
            --only-binary=:all: --no-index --no-deps wheelhouse/*.whl
          test "$(python -c 'import _lisjong_native; print(_lisjong_native.SOURCE_REVISION)')" = "$LISJONG_NATIVE_SOURCE_REVISION"

      - name: Verify internal VCS dependency identity
        run: python -m lisjong_arena.environment_verify --project pyproject.toml

      - name: Run assigned test modules
        shell: bash
        env:
          TEST_SHARD: "${{ matrix.shard }}"
          TEST_SHARD_COUNT: "3"
        run: |
          mapfile -d '' -t test_files < <(
            find tests -type f -name 'test*.py' -print0 | sort -z
          )
          ((${#test_files[@]} > 0))

          declare -A seen_patterns=()
          selected_patterns=()
          for index in "${!test_files[@]}"; do
            test_file="${test_files[$index]}"
            pattern="$(basename "$test_file")"
            if [[ -n "${seen_patterns[$pattern]:-}" ]]; then
              echo "Duplicate test filename cannot be selected safely: $pattern" >&2
              echo "  ${seen_patterns[$pattern]}" >&2
              echo "  $test_file" >&2
              exit 1
            fi
            seen_patterns[$pattern]="$test_file"
            if (( index % TEST_SHARD_COUNT == TEST_SHARD )); then
              selected_patterns+=("$pattern")
            fi
          done
          ((${#selected_patterns[@]} > 0))

          echo "Test shard ${TEST_SHARD}/${TEST_SHARD_COUNT}: ${#selected_patterns[@]} of ${#test_files[@]} modules"

          # The runner lives under RUNNER_TEMP, so explicitly keep the repository
          # root importable for namespace-package imports such as `from tests import ...`.
          export PYTHONPATH="$GITHUB_WORKSPACE${PYTHONPATH:+:$PYTHONPATH}"

          test_runner="$RUNNER_TEMP/run_unittest_modules.py"
          cat > "$test_runner" <<'PY'
          import sys
          import unittest


          def main() -> int:
              suite = unittest.TestSuite()
              for pattern in sys.argv[1:]:
                  found = unittest.defaultTestLoader.discover("tests", pattern=pattern)
                  if found.countTestCases() == 0:
                      print(f"No unittest cases discovered: {pattern}", file=sys.stderr)
                      return 1
                  suite.addTests(found)

              # One interpreter for the whole shard, as the unsplit suite ran.
              runner = unittest.TextTestRunner(verbosity=2, durations=30)
              result = runner.run(suite)
              return 0 if result.wasSuccessful() else 1


          if __name__ == "__main__":
              raise SystemExit(main())
          PY

          python "$test_runner" "${selected_patterns[@]}"

  # The required check: formatting, lint and the full suite. It fails unless the
  # static checks and every test shard succeeded.
  quality:
    name: quality
    needs: [static-checks, test-shards]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require the static checks and all test shards to pass
        shell: bash
        env:
          STATIC_CHECKS_RESULT: "${{ needs.static-checks.result }}"
          TEST_SHARDS_RESULT: "${{ needs.test-shards.result }}"
        run: |
          if [[ "$STATIC_CHECKS_RESULT" != "success" || "$TEST_SHARDS_RESULT" != "success" ]]; then
            echo "static-checks: $STATIC_CHECKS_RESULT / test shards: $TEST_SHARDS_RESULT" >&2
            exit 1
          fi

  ml-test-shards:
    name: ml-tests-shard-${{ matrix.shard }}
    needs: native-wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install package and development tools
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Download the same-revision native wheel
        uses: actions/download-artifact@v4
        with:
          name: lisjong-native-ci-wheel
          path: wheelhouse

      - name: Install the same-revision native wheel (binary only, no index)
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check \
            --only-binary=:all: --no-index --no-deps wheelhouse/*.whl
          test "$(python -c 'import _lisjong_native; print(_lisjong_native.SOURCE_REVISION)')" = "$LISJONG_NATIVE_SOURCE_REVISION"

      - name: Verify internal VCS dependency identity
        run: python -m lisjong_arena.environment_verify --project pyproject.toml

      - name: Install locked CPU PyTorch
        run: python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu "torch==2.13.0"

      - name: Verify locked CPU PyTorch
        run: python -c "import torch; assert torch.__version__ == '2.13.0+cpu'; assert not torch.cuda.is_available()"

      - name: Run assigned test modules with ML dependency in isolated interpreters
        shell: bash
        env:
          ML_TEST_SHARD: "${{ matrix.shard }}"
          ML_TEST_SHARD_COUNT: "3"
        run: |
          mapfile -d '' -t test_files < <(
            find tests -type f -name 'test*.py' -print0 | sort -z
          )
          ((${#test_files[@]} > 0))

          selected_files=()
          for index in "${!test_files[@]}"; do
            if (( index % ML_TEST_SHARD_COUNT == ML_TEST_SHARD )); then
              selected_files+=("${test_files[$index]}")
            fi
          done
          ((${#selected_files[@]} > 0))

          echo "ML test shard ${ML_TEST_SHARD}/${ML_TEST_SHARD_COUNT}: ${#selected_files[@]} of ${#test_files[@]} modules"

          # The runner lives under RUNNER_TEMP, so explicitly keep the repository
          # root importable for namespace-package imports such as `from tests import ...`.
          export PYTHONPATH="$GITHUB_WORKSPACE${PYTHONPATH:+:$PYTHONPATH}"

          test_runner="$RUNNER_TEMP/run_unittest_module.py"
          cat > "$test_runner" <<'PY'
          import sys
          import unittest


          def main() -> int:
              pattern, test_file = sys.argv[1:]
              suite = unittest.defaultTestLoader.discover("tests", pattern=pattern)
              test_count = suite.countTestCases()

              if test_count == 0:
                  print(f"No unittest cases discovered: {test_file}", file=sys.stderr)
                  return 1

              runner = unittest.TextTestRunner(verbosity=2, durations=30)
              result = runner.run(suite)
              return 0 if result.wasSuccessful() else 1


          if __name__ == "__main__":
              raise SystemExit(main())
          PY

          declare -A seen_patterns=()
          for test_file in "${selected_files[@]}"; do
            pattern="$(basename "$test_file")"
            if [[ -n "${seen_patterns[$pattern]:-}" ]]; then
              echo "Duplicate test filename cannot be isolated safely: $pattern" >&2
              echo "  ${seen_patterns[$pattern]}" >&2
              echo "  $test_file" >&2
              exit 1
            fi
            seen_patterns[$pattern]="$test_file"

            python "$test_runner" "$pattern" "$test_file"
          done

  ml-tests:
    name: ml-tests
    needs: ml-test-shards
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require all ML test shards to pass
        shell: bash
        env:
          ML_SHARDS_RESULT: "${{ needs.ml-test-shards.result }}"
        run: |
          if [[ "$ML_SHARDS_RESULT" != "success" ]]; then
            echo "ML test shards did not all pass: $ML_SHARDS_RESULT" >&2
            exit 1
          fi

  ron-source-native:
    name: ron-source-native
    needs: native-wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LISJONG_REQUIRE_NATIVE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install pinned Arena
        run: python -m pip install --disable-pip-version-check -e .
      - name: Download the same-revision native wheel
        uses: actions/download-artifact@v4
        with:
          name: lisjong-native-ci-wheel
          path: wheelhouse

      - name: Install the same-revision native wheel (binary only, no index)
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check \
            --only-binary=:all: --no-index --no-deps wheelhouse/*.whl
          test "$(python -c 'import _lisjong_native; print(_lisjong_native.SOURCE_REVISION)')" = "$LISJONG_NATIVE_SOURCE_REVISION"
      - name: Validate synthetic engine source with the real lisjong reader
        run: |
          python -m unittest discover -s tests -p test_ron_legal_source_producer.py -v
          python -m unittest discover -s tests -p test_generate_ron_legal_baseline_460.py -v
