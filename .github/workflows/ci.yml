name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install package and development tools
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Run lint
        run: python -m ruff check .

      - name: Run tests
        run: python -m unittest discover -s tests -v --durations 30

  phase6-ml:
    name: phase6-ml
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install package and development tools
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Install locked CPU PyTorch
        run: python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu "torch==2.13.0"

      - name: Verify locked CPU PyTorch
        run: python -c "import torch; assert torch.__version__ == '2.13.0+cpu'; assert not torch.cuda.is_available()"

      - name: Run Learned Policy, snapshot, and sequential ML focused tests
        run: |
          python -m unittest discover -s tests -p "test_learned_policy_input_ml.py" -v
          python -m unittest discover -s tests -p "test_learned_policy_stage2_ml.py" -v
          python -m unittest discover -s tests -p "test_learned_policy_stage3_ml.py" -v
          python -m unittest discover -s tests -p "test_phase?_snapshot*.py" -v
          python -m unittest discover -s tests -p "test_phase8_sequential_ml.py" -v
          python -m unittest discover -s tests -p "test_phase9_confirmatory_ml.py" -v
          python -m unittest discover -s tests -p "test_stage3_entry_gate_ml.py" -v
