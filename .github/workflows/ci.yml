name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install package and development tools
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Run lint
        run: python -m ruff check .

      - name: Run tests
        run: python -m unittest discover -s tests -v --durations 30

  ml-tests:
    name: ml-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install package and development tools
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Install locked CPU PyTorch
        run: python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu "torch==2.13.0"

      - name: Verify locked CPU PyTorch
        run: python -c "import torch; assert torch.__version__ == '2.13.0+cpu'; assert not torch.cuda.is_available()"

      - name: Run all test modules with ML dependency in isolated interpreters
        shell: bash
        run: |
          mapfile -d '' -t test_files < <(
            find tests -type f -name 'test*.py' -print0 | sort -z
          )
          ((${#test_files[@]} > 0))

          declare -A seen_patterns=()
          for test_file in "${test_files[@]}"; do
            pattern="$(basename "$test_file")"
            if [[ -n "${seen_patterns[$pattern]:-}" ]]; then
              echo "Duplicate test filename cannot be isolated safely: $pattern" >&2
              echo "  ${seen_patterns[$pattern]}" >&2
              echo "  $test_file" >&2
              exit 1
            fi
            seen_patterns[$pattern]="$test_file"

            if ! python -c 'import sys, unittest; suite = unittest.defaultTestLoader.discover("tests", pattern=sys.argv[1]); raise SystemExit(0 if suite.countTestCases() > 0 else 1)' "$pattern"; then
              if [[ "$test_file" == "tests/test_comparison_parallel_integration.py" ]]; then
                echo "Intentional zero-test compatibility stub: $test_file"
                continue
              fi
              echo "No unittest cases discovered: $test_file" >&2
              exit 1
            fi

            python -m unittest discover \
              -s tests \
              -p "$pattern" \
              -v \
              --durations 30
          done
