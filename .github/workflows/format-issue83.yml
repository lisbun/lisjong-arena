name: Issue 83 format helper

on:
  push:
    branches:
      - issue-83-phase3-bootstrap-corpus

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: issue-83-phase3-bootstrap-corpus
          fetch-depth: 0

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install package and development tools
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Format Issue 83 files
        run: >-
          python -m ruff format
          src/lisjong_arena/phase3_bootstrap_corpus
          tests/_phase3_bootstrap_fixtures.py
          tests/test_phase3_bootstrap_corpus.py

      - name: Commit formatting if needed
        shell: bash
        run: |
          paths=(
            src/lisjong_arena/phase3_bootstrap_corpus
            tests/_phase3_bootstrap_fixtures.py
            tests/test_phase3_bootstrap_corpus.py
          )
          if git diff --quiet -- "${paths[@]}"; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${paths[@]}"
          git commit -m "Format Phase 3 bootstrap corpus code"
          git push origin HEAD:issue-83-phase3-bootstrap-corpus
