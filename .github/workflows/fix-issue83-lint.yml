name: Issue 83 lint fix helper

on:
  push:
    branches:
      - issue-83-phase3-bootstrap-corpus

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: issue-83-phase3-bootstrap-corpus
          fetch-depth: 0
      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install development tools
        run: python -m pip install --disable-pip-version-check ruff==0.16.0
      - name: Fix lint
        run: python -m ruff check --fix src/lisjong_arena/phase3_bootstrap_corpus/decoding.py
      - name: Commit fix if needed
        shell: bash
        run: |
          path=src/lisjong_arena/phase3_bootstrap_corpus/decoding.py
          if git diff --quiet -- "$path"; then
            echo "Already clean"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$path"
          git commit -m "Fix Phase 3 bootstrap lint"
          git push origin HEAD:issue-83-phase3-bootstrap-corpus
