name: Issue 181 lintfix

on:
  push:
    branches:
      - issue-181-p6-conservative-q-gate-a

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[issue-181-lintfix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-181-p6-conservative-q-gate-a
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install locked ruff
        run: python -m pip install ruff==0.16.0
      - name: Apply lint fixes
        run: >-
          python -m ruff check --fix
          src/lisjong_arena/learned_policy_offline_q/p6_conservative_q.py
          src/lisjong_arena/learned_policy_offline_q/p6_gate_a.py
          tests/test_issue_181_p6_gate_a.py
          tests/test_issue_181_p6_gate_a_ml.py
      - name: Reformat after lint fixes
        run: >-
          python -m ruff format
          src/lisjong_arena/learned_policy_offline_q/p6_conservative_q.py
          src/lisjong_arena/learned_policy_offline_q/p6_gate_a.py
          tests/test_issue_181_p6_gate_a.py
          tests/test_issue_181_p6_gate_a_ml.py
      - name: Verify patch
        run: |
          python -m ruff check src/lisjong_arena/learned_policy_offline_q/p6_conservative_q.py src/lisjong_arena/learned_policy_offline_q/p6_gate_a.py tests/test_issue_181_p6_gate_a.py tests/test_issue_181_p6_gate_a_ml.py
          python -m ruff format --check src/lisjong_arena/learned_policy_offline_q/p6_conservative_q.py src/lisjong_arena/learned_policy_offline_q/p6_gate_a.py tests/test_issue_181_p6_gate_a.py tests/test_issue_181_p6_gate_a_ml.py
          git diff --check
      - name: Commit and push
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lisjong_arena/learned_policy_offline_q/p6_conservative_q.py \
                  src/lisjong_arena/learned_policy_offline_q/p6_gate_a.py \
                  tests/test_issue_181_p6_gate_a.py \
                  tests/test_issue_181_p6_gate_a_ml.py
          git commit -m '[issue-181-lintfix] Apply ruff lint fixes'
          git push origin HEAD:issue-181-p6-conservative-q-gate-a
