name: Track B main temporary

on:
  pull_request:

permissions:
  contents: read

jobs:
  main-measurement:
    name: preregistered-main-20-29
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install package
        run: python -m pip install --disable-pip-version-check -e .

      - name: Run preregistered Track B main measurement
        run: python -m lisjong_arena.oracle_sensitivity_main
