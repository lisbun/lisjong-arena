name: P6 Gate B Merged Main Target Fix

on:
  push:
    branches:
      - issue-183-p6-gate-b

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-183-p6-gate-b
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install Ruff
        run: python -m pip install 'ruff==0.16.0'
      - name: Require HEAD equals fetched origin main
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/lisjong_arena/learned_policy_offline_q/p6_gate_b.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'from .p1_shanten_guard_higher_fidelity import (\n    _require_clean_arena_head,\n    runtime_block,\n)\n',
              'from .p1_shanten_guard_higher_fidelity import (\n    _require_clean_arena_head,\n    _resolve_execution_target_revision,\n    runtime_block,\n)\n',
          )
          old = '''    current_revision = _require_clean_arena_head()\n    if current_revision != provenance.lisjong_arena_revision:\n        raise _error(\n            "Arena provenance revision is not the Issue #183 merged-main target"\n        )\n    return {\n'''
          new = '''    current_revision = _require_clean_arena_head()\n    merged_main_revision = _resolve_execution_target_revision()\n    if current_revision != provenance.lisjong_arena_revision:\n        raise _error("Arena HEAD differs from collected execution provenance")\n    if current_revision != merged_main_revision:\n        raise _error(\n            "Arena HEAD must equal the locally fetched origin/main merged revision"\n        )\n    return {\n'''
          if old not in text:
              raise SystemExit('expected target function block not found')
          text = text.replace(old, new)
          path.write_text(text, encoding='utf-8', newline='\n')

          test_path = Path('tests/test_learned_policy_offline_q_p6_gate_b.py')
          tests = test_path.read_text(encoding='utf-8')
          old = '''        with mock.patch.object(\n            gate_b, "_require_clean_arena_head",\n            return_value=current.lisjong_arena_revision,\n        ):\n            target = gate_b.execution_target_block(current)\n'''
          new = '''        with (\n            mock.patch.object(\n                gate_b, "_require_clean_arena_head",\n                return_value=current.lisjong_arena_revision,\n            ),\n            mock.patch.object(\n                gate_b, "_resolve_execution_target_revision",\n                return_value=current.lisjong_arena_revision,\n            ),\n        ):\n            target = gate_b.execution_target_block(current)\n'''
          if old not in tests:
              raise SystemExit('expected positive target test block not found')
          tests = tests.replace(old, new)
          old = '''        with mock.patch.object(\n            gate_b, "_require_clean_arena_head", return_value="f" * 40\n        ):\n            with self.assertRaises(gate_b.P6GateBError):\n                gate_b.execution_target_block(current)\n'''
          new = '''        with (\n            mock.patch.object(\n                gate_b, "_require_clean_arena_head", return_value="f" * 40\n            ),\n            mock.patch.object(\n                gate_b, "_resolve_execution_target_revision",\n                return_value="f" * 40,\n            ),\n        ):\n            with self.assertRaises(gate_b.P6GateBError):\n                gate_b.execution_target_block(current)\n\n    def test_execution_target_rejects_head_not_at_origin_main(self):\n        current = provenance()\n        with (\n            mock.patch.object(\n                gate_b, "_require_clean_arena_head",\n                return_value=current.lisjong_arena_revision,\n            ),\n            mock.patch.object(\n                gate_b, "_resolve_execution_target_revision", return_value="f" * 40\n            ),\n        ):\n            with self.assertRaises(gate_b.P6GateBError):\n                gate_b.execution_target_block(current)\n'''
          if old not in tests:
              raise SystemExit('expected negative target test block not found')
          tests = tests.replace(old, new)
          test_path.write_text(tests, encoding='utf-8', newline='\n')
      - name: Format and lint
        run: |
          python -m ruff format src/lisjong_arena/learned_policy_offline_q/p6_gate_b.py tests/test_learned_policy_offline_q_p6_gate_b.py
          python -m ruff check --fix src/lisjong_arena/learned_policy_offline_q/p6_gate_b.py tests/test_learned_policy_offline_q_p6_gate_b.py
      - name: Commit fix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lisjong_arena/learned_policy_offline_q/p6_gate_b.py tests/test_learned_policy_offline_q_p6_gate_b.py
          git commit -m 'Require P6 Gate B HEAD at fetched origin main'
          git push origin HEAD:issue-183-p6-gate-b
