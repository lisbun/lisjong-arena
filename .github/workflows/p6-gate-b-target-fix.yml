name: P6 Gate B Execution Target Fix

on:
  push:
    branches:
      - issue-183-p6-gate-b

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-183-p6-gate-b
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install Ruff
        run: python -m pip install 'ruff==0.16.0'
      - name: Make execution target Issue 183 specific
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/lisjong_arena/learned_policy_offline_q/p6_gate_b.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'from .p1_shanten_guard_higher_fidelity import (\n    _require_clean_arena_head,\n    execution_target_block,\n    runtime_block,\n)\n',
              'from .p1_shanten_guard_higher_fidelity import (\n    _require_clean_arena_head,\n    runtime_block,\n)\n',
          )

          marker = '''def lock_identity(document: dict[str, object]) -> str:\n'''
          helper = '''def execution_target_block(\n    provenance: SingleRoundExecutionProvenance,\n) -> dict[str, object]:\n    """Bind execution to clean fetched merged main for Issue #183."""\n    if not isinstance(provenance, SingleRoundExecutionProvenance):\n        raise TypeError("provenance must be a SingleRoundExecutionProvenance")\n    current_revision = _require_clean_arena_head()\n    if current_revision != provenance.lisjong_arena_revision:\n        raise _error(\n            "Arena provenance revision is not the Issue #183 merged-main target"\n        )\n    return {\n        "branch": "main",\n        "head_equals_origin_main": True,\n        "merge_status": "merged-main",\n        "merged_main_revision": current_revision,\n        "source_pr": "lisbun/lisjong-arena#184",\n        "source_issue": SOURCE_ISSUE,\n    }\n\n\n'''
          if helper not in text:
              text = text.replace(marker, helper + marker)

          old = '''    target = document["execution_target"]\n    if (\n        type(target) is not dict\n        or target.get("merged_main_revision") != provenance.lisjong_arena_revision\n        or target.get("head_matches_merged_main") is not True\n    ):\n        raise _error("pre-execution lock execution target is invalid")\n'''
          new = '''    target = document["execution_target"]\n    expected_target = {\n        "branch": "main",\n        "head_equals_origin_main": True,\n        "merge_status": "merged-main",\n        "merged_main_revision": provenance.lisjong_arena_revision,\n        "source_pr": "lisbun/lisjong-arena#184",\n        "source_issue": SOURCE_ISSUE,\n    }\n    if target != expected_target:\n        raise _error("pre-execution lock execution target is invalid")\n'''
          if old not in text:
              raise SystemExit('expected execution-target validator block not found')
          text = text.replace(old, new)
          path.write_text(text, encoding='utf-8', newline='\n')

          test_path = Path('tests/test_learned_policy_offline_q_p6_gate_b.py')
          tests = test_path.read_text(encoding='utf-8')
          anchor = '''class LockSurfaceTest(unittest.TestCase):\n'''
          addition = '''class ExecutionTargetTest(unittest.TestCase):\n    def test_execution_target_is_issue_183_specific(self):\n        current = provenance()\n        with mock.patch.object(\n            gate_b, "_require_clean_arena_head",\n            return_value=current.lisjong_arena_revision,\n        ):\n            target = gate_b.execution_target_block(current)\n        self.assertEqual(target["source_pr"], "lisbun/lisjong-arena#184")\n        self.assertEqual(target["source_issue"], gate_b.SOURCE_ISSUE)\n        self.assertIs(target["head_equals_origin_main"], True)\n        self.assertEqual(\n            target["merged_main_revision"], current.lisjong_arena_revision\n        )\n\n    def test_execution_target_rejects_provenance_revision_drift(self):\n        current = provenance()\n        with mock.patch.object(\n            gate_b, "_require_clean_arena_head", return_value="f" * 40\n        ):\n            with self.assertRaises(gate_b.P6GateBError):\n                gate_b.execution_target_block(current)\n\n\n'''
          if addition not in tests:
              tests = tests.replace(anchor, addition + anchor)
          test_path.write_text(tests, encoding='utf-8', newline='\n')
      - name: Format and lint
        run: |
          python -m ruff format src/lisjong_arena/learned_policy_offline_q/p6_gate_b.py tests/test_learned_policy_offline_q_p6_gate_b.py
          python -m ruff check --fix src/lisjong_arena/learned_policy_offline_q/p6_gate_b.py tests/test_learned_policy_offline_q_p6_gate_b.py
      - name: Commit fix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lisjong_arena/learned_policy_offline_q/p6_gate_b.py tests/test_learned_policy_offline_q_p6_gate_b.py
          git commit -m 'Make P6 Gate B execution target Issue 183 specific'
          git push origin HEAD:issue-183-p6-gate-b
