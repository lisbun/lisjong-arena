name: Issue 256 format

on:
  push:
    branches:
      - issue-256-offensive-efficiency-diagnostic

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-256-offensive-efficiency-diagnostic
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - name: Install Ruff
        run: python -m pip install --disable-pip-version-check 'ruff==0.16.0'
      - name: Format #256 files
        run: |
          python -m ruff format \
            src/lisjong_arena/offensive_efficiency_diagnostic \
            tests/test_offensive_efficiency_diagnostic.py \
            tests/test_offensive_efficiency_phase2_reporting.py
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lisjong_arena/offensive_efficiency_diagnostic tests/test_offensive_efficiency_diagnostic.py tests/test_offensive_efficiency_phase2_reporting.py
          git commit -m 'Format #256 diagnostic files'
          git push origin HEAD:issue-256-offensive-efficiency-diagnostic
