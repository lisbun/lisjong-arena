name: Track B pilot temporary

on:
  pull_request:

permissions:
  contents: read

jobs:
  pilot:
    name: pilot-0-19
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install package
        run: python -m pip install --disable-pip-version-check -e .

      - name: Run coverage-only Track B pilot
        run: python -m lisjong_arena.oracle_sensitivity_pilot --seeds 0:19
