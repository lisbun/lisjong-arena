name: Track B pilot temporary

on:
  pull_request:

permissions:
  contents: read

jobs:
  pilot:
    name: pilot-${{ matrix.seeds }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        seeds: ["0:4", "5:9", "10:14", "15:19"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install package
        run: python -m pip install --disable-pip-version-check -e .

      - name: Run coverage-only Track B pilot shard
        run: python -m lisjong_arena.oracle_sensitivity_pilot --seeds ${{ matrix.seeds }}
